<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Todo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 30px;
      border-radius: 12px;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { font-size: 1.5rem; color: #5eead4; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px; }
    .btn-retry {
      display: inline-block;
      background-color: lightseagreen;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .btn-retry:hover { background-color: #0f766e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>( ͡° ͜ʖ ͡°) Sinyal Terputus</h1>
    <p>Anda sedang berada di ruang tanpa koneksi internet (*The Offline Abyss*). Beberapa fitur server-side MySQL memerlukan koneksi aktif.</p>
    <button class="btn-retry" onclick="window.location.reload()">Coba Muat Ulang</button>
  </div>
</body>
</html>
